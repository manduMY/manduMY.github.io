title: manduMY.dev
tagline: 기술 정리 블로그
description: 기술 정리 블로그
url: "https://mandumy.github.io"
baseurl: ""
author: manduMY
email: poi31320@gmail.com
github_username: manduMY
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-feed

# ── 주제 정의 ──────────────────────────────────────────────
# 왼쪽 사이드바 "주제별"에 직접 정한 주제만 노출된다.
# 글에 단 태그(tags)가 아래 tags 목록에 하나라도 걸리면 그 주제로 묶인다.
# 주제를 추가/이름변경/재배치하려면 이 목록만 고치면 된다.
topics:
  - name: 백엔드 · API
    tags: [API Design, MSA, Idempotency, Payments]
  - name: 데이터베이스
    tags: [MySQL, Index, Redis, Cache]
  - name: 인프라 · 관측
    tags: [Kafka, Observability]
  - name: 트러블슈팅 · 성능
    tags: [장애대응, Performance]

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore
