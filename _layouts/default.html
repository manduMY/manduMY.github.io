<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
<div class="layout">

  <aside>
    <div>
      <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>manduMY<span class="g">.dev</span></a>
      <div class="tagline">{{ site.tagline }}</div>
    </div>
    <nav class="side">
      <a class="{% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}"><span class="ic">›</span> 홈</a>
      <a class="{% if page.nav == 'archive' %}active{% endif %}" href="{{ '/archive/' | relative_url }}"><span class="ic">✎</span> 글 전체</a>
      <a class="{% if page.nav == 'tags' %}active{% endif %}" href="{{ '/tags/' | relative_url }}"><span class="ic">#</span> 태그</a>
      <a class="{% if page.nav == 'about' %}active{% endif %}" href="{{ '/about/' | relative_url }}"><span class="ic">◎</span> 소개</a>
    </nav>
    <div class="side-foot">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
  </aside>

  <main>
    {{ content }}
  </main>

</div>
</body>
</html>
